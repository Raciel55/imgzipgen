<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador ZIP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }

        .preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .preview img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .2);
        }
    </style>

</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">
            Generador de Copias ZIP
        </h1>

        <div class="card p-4 shadow">

            <!-- COPIAS -->
            <div class="mb-3">

                <label class="form-label">
                    Número de copias
                </label>

                <select id="copias" class="form-select" value="10">
                    
                    <option value="10">10</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>

                </select>

            </div>

            <!-- IMAGENES -->
            <div class="mb-4">

                <input type="file" id="imagenes" class="form-control" multiple accept="image/jpg, image/jpeg">
                <!-- NOMBRE DEL ZIP -->
                <div class="mb-4">

                    <label class="form-label">
                        Nombre del archivo ZIP
                    </label>

                    <input type="text" id="nombreZip" value="freeanuel" class="form-control" placeholder="Ejemplo: mis_imagenes">

                </div>
            </div>

            <!-- BOTON -->
            <div class="text-center">

                <button id="crearZip" class="btn btn-primary btn-lg">
                    Crear ZIP
                </button>

            </div>

        </div>

        <!-- PREVIEW -->
        <div id="preview" class="preview"></div>

    </div>

    <!-- LIBRERIAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script src="app.js"></script>

</body>

</html>
